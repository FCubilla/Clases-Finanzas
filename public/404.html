<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facupadel</title>
  </head>
  <body>
    <script>
      const path = window.location.pathname.replace(/\/$/, '')
      const repoName = 'facupadel'
      const redirectPath = `${window.location.protocol}//${window.location.host}/${repoName}${path}${window.location.search}${window.location.hash}`
      window.location.replace(redirectPath)
    </script>
  </body>
</html>
